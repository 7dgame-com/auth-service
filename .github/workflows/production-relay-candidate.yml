name: Production provider relay candidate

on:
  push:
    branches: [codex/auth-production-relay-baseline-20261012]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish this commit's immutable relay candidate only (no deployment)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard exact production baseline branch
        env:
          CANDIDATE_REF: ${{ github.ref }}
        run: test "$CANDIDATE_REF" = refs/heads/codex/auth-production-relay-baseline-20261012
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: node deploy/verify-production-baseline.cjs

  candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME || secrets.TENCENT_REGISTRY_USER }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: hkccr.ccs.tencentyun.com/plugins/auth-service:candidate-relay-${{ github.sha }}
          build-args: BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: true
      - name: Record immutable candidate
        env:
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg revision "$REVISION" --arg digest "$DIGEST" '{revision:$revision,digest:$digest,platform:"linux/amd64",deployed:false}' > production-relay-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-relay-candidate-${{ github.sha }}
          path: production-relay-candidate.json
          retention-days: 30
